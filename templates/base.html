<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-white hover:text-indigo-400 transition">
                Jochen Hoffmann
            </a>
            <nav class="flex items-center space-x-6">
                <a href="/projects/" class="hover:text-indigo-400 text-sm font-medium transition">Projekte</a>
                <a href="https://github.com/jchnhffmnn90" target="_blank" rel="noopener noreferrer" class="hover:text-indigo-400 text-sm font-medium transition">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-800 py-6 text-center text-sm text-gray-500">
        <div class="max-w-6xl mx-auto px-4">
            &copy; {% now "Y" %} Jochen Hoffmann. Built with Django & Tailwind CSS.
        </div>
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
