[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "**/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",    # Line length handled by formatter
    "RUF012",  # Mutable class attributes are standard in Django (models, admin, forms)
]
